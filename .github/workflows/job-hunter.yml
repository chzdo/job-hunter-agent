name: Autonomous Job Hunter & Application Scheduler

on:
  schedule:
    # Runs every 12 hours automatically
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "job-hunter-run"
  cancel-in-progress: false

jobs:
  job-hunter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Run Job Hunter Cycle
        env:
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          INDEED_EMAIL: ${{ secrets.INDEED_EMAIL }}
          INDEED_PASSWORD: ${{ secrets.INDEED_PASSWORD }}
        run: |
          python scheduler.py --run-now

      - name: Upload Dashboard & Database Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: job-hunter-reports
          path: |
            data/dashboard.html
            data/jobs.db

      - name: Setup GitHub Pages
        if: always()
        uses: actions/configure-pages@v4

      - name: Prepare Pages Index
        if: always()
        run: |
          cp data/dashboard.html data/index.html || true

      - name: Upload GitHub Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
